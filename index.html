<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Desert Test Begins</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>The Desert Test Begins</h1>
    <p><strong>Riddle:</strong> I dance on the wind and burn in your mind, <br>Sought by empires, yet born of death. <br>Without me, no journey through stars. <br>What am I? (no spaces or apostrophes in your answer)</p>
    <input type="text" id="answer" placeholder="Enter your answer">
    <button onclick="checkAnswer()">Submit</button>
    <p id="message"></p>
  </div>

  <audio autoplay loop>
    <source src="desert-wind.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script>
    function checkAnswer() {
      const input = document.getElementById("answer").value.toLowerCase().trim();
      if (input === "spice") {
        window.location.href = "2.html";
      } else {
        document.getElementById("message").textContent = "Not yet, seeker. Try again.";
      }
    }
  </script>
</body>
</html>
